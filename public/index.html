<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCap — Hospital Capacity Management</title>
  <meta name="description" content="Real-time hospital room and bed capacity management dashboard." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { brand: { indigo: '#6366f1', sky: '#06b6d4', violet: '#8b5cf6', teal: '#14b8a6', amber: '#f59e0b' } },
        fontFamily: {
          sans: ['Inter','ui-sans-serif','system-ui','sans-serif'],
          mono: ['Fira Code','ui-monospace','monospace'],
          display: ['"Playfair Display"','ui-serif','Georgia','serif'],
          grotesk: ['"Darker Grotesque"','Inter','sans-serif'],
        },
      } },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@600;700;800;900&family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Playfair Display', serif; }
    .heading-grotesk { font-family: 'Darker Grotesque', sans-serif; font-weight: 800; letter-spacing: -.01em; line-height: .95; }
    .aurora { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .aurora::before, .aurora::after {
      content: ""; position: absolute; width: 50vw; height: 50vw; border-radius: 50%;
      filter: blur(100px); opacity: .4; mix-blend-mode: screen; animation: drift 20s ease-in-out infinite alternate;
    }
    .aurora::before { top: -15%; left: -10%; background: radial-gradient(circle at 30% 30%, #6366f1, transparent 60%); }
    .aurora::after  { bottom: -20%; right: -10%; background: radial-gradient(circle at 70% 70%, #06b6d4, transparent 60%); animation-delay: -10s; }
    @keyframes drift { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(3%,2%) scale(1.06)} 100%{transform:translate(-2%,-2%) scale(.97)} }
    ::selection { background: #6366f1; color: #fff; }
    a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #06b6d4; outline-offset: 2px; }
    .gauge-fill { transition: width .6s cubic-bezier(.22,1,.36,1); }
    .card-enter { animation: cardIn .45s cubic-bezier(.22,1,.36,1) both; }
    @keyframes cardIn { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
    @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important} }
  </style>
</head>

<body class="relative min-h-screen bg-slate-950 text-slate-200 antialiased">
  <div class="aurora" aria-hidden="true"></div>

  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-8 py-8">
    <!-- Header -->
    <header class="flex flex-wrap items-end justify-between gap-4 mb-8">
      <div>
        <p class="font-mono text-xs text-brand-sky mb-1">HOSPITAL OPERATIONS</p>
        <h1 class="font-display text-4xl sm:text-5xl font-bold">
          Medi<span class="text-brand-sky">Cap</span>
        </h1>
        <p class="text-slate-400 mt-1 text-sm">Real-time room &amp; bed capacity management</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="refresh-btn" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-slate-700 hover:border-brand-sky hover:text-brand-sky transition-colors text-sm font-medium">
          <i class="ri-refresh-line"></i> Refresh
        </button>
        <button id="admit-btn" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-brand-indigo hover:bg-indigo-500 text-white font-medium shadow-lg shadow-brand-indigo/25 transition-all hover:-translate-y-0.5">
          <i class="ri-user-add-line"></i> Admit Patient
        </button>
      </div>
    </header>

    <!-- Stat tiles -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8" id="stats" aria-label="Capacity summary">
      <!-- filled by JS -->
    </section>

    <!-- Filters -->
    <section class="flex flex-wrap items-center gap-3 mb-6" aria-label="Filters">
      <div class="flex items-center gap-2 text-sm text-slate-400"><i class="ri-filter-3-line"></i> Filter</div>
      <select id="f-department" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-brand-sky">
        <option value="">All Departments</option>
      </select>
      <select id="f-type" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-brand-sky">
        <option value="">All Room Types</option>
        <option>ICU</option><option>Private</option><option>Semi-Private</option><option>General Ward</option>
      </select>
      <select id="f-status" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-brand-sky">
        <option value="">All Statuses</option>
        <option>Available</option><option>Full</option><option>Maintenance</option>
      </select>
      <button id="f-clear" class="text-sm text-slate-400 hover:text-brand-sky underline-offset-2 hover:underline">Clear</button>
    </section>

    <!-- Capacity grid -->
    <h2 class="heading-grotesk text-3xl mb-4">Live Capacity Grid</h2>
    <section id="rooms" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5" aria-live="polite">
      <!-- room cards injected by JS -->
    </section>
    <p id="rooms-empty" class="hidden text-slate-500 text-sm py-10 text-center">No rooms match the current filters.</p>
  </div>

  <!-- Admit modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" data-close></div>
    <div class="relative w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-2xl card-enter">
      <div class="flex items-center justify-between mb-5">
        <h3 id="modal-title" class="font-display text-2xl font-bold">Admit a Patient</h3>
        <button data-close aria-label="Close" class="w-9 h-9 grid place-items-center rounded-lg hover:bg-slate-800"><i class="ri-close-line text-xl"></i></button>
      </div>
      <form id="admit-form" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="first_name" class="block text-sm text-slate-400 mb-1">First name</label>
            <input id="first_name" name="first_name" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 focus:border-brand-sky" />
          </div>
          <div>
            <label for="last_name" class="block text-sm text-slate-400 mb-1">Last name</label>
            <input id="last_name" name="last_name" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 focus:border-brand-sky" />
          </div>
        </div>
        <div>
          <label for="contact_number" class="block text-sm text-slate-400 mb-1">Contact number</label>
          <input id="contact_number" name="contact_number" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 focus:border-brand-sky" />
        </div>
        <div>
          <label for="room_id" class="block text-sm text-slate-400 mb-1">Assign room <span class="text-slate-500">(available only)</span></label>
          <select id="room_id" name="room_id" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 focus:border-brand-sky">
            <option value="">Select a room…</option>
          </select>
        </div>
        <p id="modal-error" class="hidden text-sm text-red-400"></p>
        <div class="flex gap-3 pt-2">
          <button type="button" data-close class="flex-1 px-4 py-2.5 rounded-lg border border-slate-700 hover:bg-slate-800 font-medium">Cancel</button>
          <button type="submit" class="flex-1 px-4 py-2.5 rounded-lg bg-brand-indigo hover:bg-indigo-500 text-white font-medium">Admit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] hidden px-5 py-3 rounded-xl text-sm font-medium shadow-xl"></div>

  <script src="app.js"></script>
</body>
</html>
